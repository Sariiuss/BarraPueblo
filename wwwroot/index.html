<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#145c42"><title>Barra del pueblo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#183c30;font:16px system-ui,sans-serif}header{background:#145c42;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:25px;margin:0}header p{margin:4px 0;color:#c9e7d6;font-size:14px}button,input{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:12px;font-weight:700}button:disabled{opacity:.45;cursor:default}header button{padding:0 16px;background:#e6f1e8;color:#145c42}main{max-width:1200px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:1fr 350px;gap:24px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}.product{background:white;border:1px solid #dce3d8;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}.product h2{font-size:17px;margin:0}.price{color:#557264}.controls{display:flex;align-items:center;gap:10px}.controls button{width:52px;font-size:25px;background:#edf2e9;color:#145c42}.controls .plus{background:#145c42;color:white}.qty{flex:1;text-align:center;font-size:23px;font-weight:700}.checkout{background:white;border-radius:20px;padding:24px;position:sticky;top:18px;align-self:start;box-shadow:0 8px 30px #173c3010}.checkout h2{font-size:19px;margin:0 0 16px}.total{font-size:44px;font-weight:800;margin:10px 0 20px}.receipt{padding:0;list-style:none;font-size:14px;color:#587266}.receipt li{display:flex;justify-content:space-between;gap:12px;margin:9px 0}label{display:block;font-weight:600;margin:18px 0 8px}input{width:100%;padding:14px;border:1px solid #c2d2c5;border-radius:12px;font-size:26px;color:#183c30}.quick{display:flex;gap:8px;margin-top:10px}.quick button{flex:1;background:#edf2e9;color:#145c42}.change{background:#e8f4e8;padding:16px;border-radius:14px;margin:18px 0}.change span{display:block;font-size:32px;font-weight:800}.primary{width:100%;background:#145c42;color:white;padding:14px}.secondary{width:100%;background:#edf2e9;color:#145c42;margin-top:10px}.message{min-height:24px;font-size:14px;margin-top:12px;color:#a02f24}.hint{font-size:12px;color:#65766a;line-height:1.6}dialog{border:0;border-radius:20px;max-width:500px;width:90%;padding:24px}dialog::backdrop{background:#10271ccc}dialog h2{margin-top:0}.summaryrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf2e9}@media(max-width:760px){main{grid-template-columns:1fr;margin-top:16px;gap:16px}.checkout{position:static}.products{gap:8px}.product{padding:12px}header{padding:18px}h1{font-size:21px}}@media(max-width:360px){.products{grid-template-columns:1fr}}
</style></head><body><header><div><h1>Barra del pueblo</h1><p>Fiestas · Cobro en efectivo</p></div><button id="summary">Ventas</button></header><main><section class="products" id="products" aria-label="Bebidas"></section><aside class="checkout"><h2>Pedido actual</h2><ul class="receipt" id="receipt"></ul><div>Total</div><div class="total" id="total">0,00 €</div><label for="received">Me entrega (€)</label><input id="received" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"><div class="quick"><button data-pay="10">10 €</button><button data-pay="20">20 €</button><button data-pay="50">50 €</button></div><div class="change" aria-live="polite"><div id="changeLabel">Cambio a devolver</div><span id="change">—</span></div><button class="primary" id="charge" disabled>Cobrar y guardar venta</button><button class="secondary" id="reset">Nuevo pedido / vaciar</button><div class="message" id="message" role="status"></div><p class="hint">Las ventas se guardan al pulsar «Cobrar». El resumen muestra las ventas registradas, sin incluir el fondo inicial de caja.</p></aside></main><dialog id="dialog"><h2>Resumen de ventas</h2><div id="summaryBody"></div><button class="secondary" id="close">Cerrar</button></dialog><script>
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n/100);
let products=[],quantities={},busy=false,saleId=null;
function received(){const raw=$('received').value.trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(raw))return null;const [a,b='']=raw.split('.');const value=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(value)&&value<=1000000?value:null;}
function items(){return products.filter(p=>quantities[p.id]>0).map(p=>({productId:p.id,quantity:quantities[p.id]}));}
function total(){return products.reduce((s,p)=>s+p.priceCents*(quantities[p.id]||0),0);}
function update(){const t=total(),r=received();$('total').textContent=money(t);$('receipt').replaceChildren();for(const p of products){const q=quantities[p.id]||0;document.querySelector(`[data-quantity="${p.id}"]`).textContent=q;document.querySelector(`[data-minus="${p.id}"]`).disabled=busy||q===0;document.querySelector(`[data-plus="${p.id}"]`).disabled=busy||q>=100;if(q){const li=document.createElement('li'),name=document.createElement('span'),price=document.createElement('span');name.textContent=`${q} × ${p.name}`;price.textContent=money(q*p.priceCents);li.append(name,price);$('receipt').append(li);}}$('changeLabel').textContent=r!==null&&r<t?'Faltan por pagar':'Cambio a devolver';$('change').textContent=r===null?'—':money(Math.abs(r-t));$('charge').disabled=busy||t===0||r===null||r<t;$('reset').disabled=busy;$('received').disabled=busy;document.querySelectorAll('[data-pay]').forEach(b=>b.disabled=busy);}
function reset(){quantities={};saleId=null;$('received').value='';update();}
async function api(path,options){const response=await fetch(path,options);let data;try{data=await response.json();}catch{throw Error('No se ha podido leer la respuesta del servidor.');}if(!response.ok)throw Error(data.error||'Error del servidor.');return data;}
$('received').addEventListener('input',()=>{saleId=null;$('message').textContent='';update();});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{saleId=null;$('received').value=b.dataset.pay;update();});$('reset').onclick=()=>{if(total()&&!confirm('¿Vaciar este pedido sin guardar una venta?'))return;reset();$('message').textContent='Pedido vacío.';};
$('charge').onclick=async()=>{if(busy)return;busy=true;saleId??=newId();update();$('message').textContent='Guardando…';try{const sale=await api('/api/sales',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:saleId,items:items(),receivedCents:received()})});reset();$('message').textContent=`Venta guardada. Devuelve ${money(sale.quote.changeCents)}.`;}catch(e){$('message').textContent=e.message+' Puedes volver a intentarlo.';}finally{busy=false;update();}};
$('summary').onclick=async()=>{try{const s=await api('/api/summary');$('summaryBody').replaceChildren();const heading=document.createElement('p');heading.textContent=`${s.count} pedidos · Recaudado: ${money(s.totalCents)}`;$('summaryBody').append(heading);for(const p of s.products){const row=document.createElement('div');row.className='summaryrow';const name=document.createElement('span'),q=document.createElement('strong');name.textContent=p.name;q.textContent=p.quantity;row.append(name,q);$('summaryBody').append(row);}$('dialog').showModal();}catch(e){$('message').textContent=e.message;}};$('close').onclick=()=>$('dialog').close();
(async()=>{try{products=await api('/api/products');for(const p of products){const card=document.createElement('article');card.className='product';const title=document.createElement('h2');title.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=money(p.priceCents);const controls=document.createElement('div');controls.className='controls';const minus=document.createElement('button'),qty=document.createElement('span'),plus=document.createElement('button');minus.textContent='−';minus.dataset.minus=p.id;minus.setAttribute('aria-label',`Quitar ${p.name}`);qty.className='qty';qty.dataset.quantity=p.id;plus.textContent='+';plus.className='plus';plus.dataset.plus=p.id;plus.setAttribute('aria-label',`Añadir ${p.name}`);minus.onclick=()=>adjust(p.id,-1);plus.onclick=()=>adjust(p.id,1);controls.append(minus,qty,plus);card.append(title,price,controls);$('products').append(card);}update();}catch(e){$('message').textContent='No se puede conectar. '+e.message;}})();
function newId(){const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const h=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;}
function adjust(id,delta){if(busy)return;quantities[id]=Math.max(0,Math.min(100,(quantities[id]||0)+delta));saleId=null;$('message').textContent='';update();}
</script></body></html>
