<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3f7658">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Barra Valdorros">
  <title>Barra de Valdorros</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/escudo-valdorros.png">
  <link rel="apple-touch-icon" href="/escudo-valdorros.png">
  <style>
    :root{--green-950:#193f2b;--green-800:#2c6547;--green-700:#3f7658;--green-300:#b8d7bf;--green-200:#d8ebdc;--green-100:#edf7ef;--lime:#c8dd6b;--paper:#fff;--ink:#1d3024;--muted:#63766a;--danger:#ad473f}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f8f2;color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{border:0;cursor:pointer;font-weight:750}
    button:disabled{cursor:default;opacity:.42}
    .app-header{background:var(--paper);border-bottom:1px solid var(--green-200);box-shadow:0 2px 12px #234a3110}
    .header-inner{max-width:900px;margin:auto;padding:12px 16px;display:grid;grid-template-columns:52px 1fr;align-items:center;gap:13px}
    .crest{display:flex;justify-content:center}
    .crest img{display:block;width:44px;height:68px;object-fit:contain}
    h1{margin:0;font-size:clamp(21px,5vw,28px);line-height:1.05;color:var(--green-950)}
    .subtitle{margin:5px 0 0;color:var(--muted);font-size:13px}
    main{width:min(900px,100%);margin:18px auto;padding:0 14px 28px;display:grid;gap:14px}
    .category-bar{min-height:48px;margin-bottom:10px;padding:0 17px;border-radius:12px;background:var(--green-700);color:white;display:flex;align-items:center;justify-content:space-between;box-shadow:0 5px 14px #315f4320}
    .category-bar strong{font-size:17px}
    .category-bar span{font-size:12px;color:#dcefe1}
    .products{display:grid;gap:8px}
    .product{min-height:64px;padding:9px 10px 9px 14px;background:var(--paper);border:1px solid #dfe8df;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 6px #29433309}
    .product-copy{min-width:0}
    .product h2{display:inline;margin:0;font-size:16px;line-height:1.2;color:#26352b}
    .price{display:inline;margin-left:6px;color:var(--muted);font-size:13px;white-space:nowrap}
    .controls{flex:0 0 auto;display:grid;grid-template-columns:44px 42px 44px;gap:6px;align-items:center}
    .controls button{height:44px;border-radius:8px;background:var(--green-200);color:var(--green-800);font-size:23px}
    .controls .plus{background:var(--green-700);color:white}
    .qty{height:44px;border:1px solid #d9e3da;border-radius:7px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--green-950)}
    .checkout{padding:16px;background:#f2f8dd;border:2px solid var(--lime);border-radius:14px;box-shadow:0 6px 20px #314e2517}
    .checkout h2{margin:0 0 12px;font-size:17px;text-align:center;color:var(--green-950)}
    .checkout-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;text-align:center}
    .metric{min-width:0}
    .metric label,.metric-title{display:block;margin-bottom:5px;font-size:14px;font-weight:800;color:var(--green-700)}
    .metric-value{min-height:40px;display:grid;place-items:center;font-size:23px;font-weight:850;color:var(--green-950);white-space:nowrap}
    .payment-input{width:100%;height:40px;padding:3px 5px;border:1px solid var(--green-300);border-radius:7px;background:white;text-align:center;color:var(--green-950);font-size:20px}
    .change-value{color:#59a85e}
    .change-value.short{color:var(--danger)}
    .quick{display:flex;gap:7px;margin:11px 0}
    .quick button{flex:1;min-height:40px;border-radius:8px;background:#dfeedd;color:var(--green-800)}
    .receipt{margin:8px 0;padding:8px 10px;list-style:none;border-radius:8px;background:#ffffffa8;color:#506359;font-size:13px}
    .receipt:empty{display:none}
    .receipt li{display:flex;justify-content:space-between;gap:10px;margin:4px 0}
    .reset-button{width:100%;min-height:48px;margin-top:8px;border-radius:9px;background:var(--green-700);color:white}
    .message{min-height:20px;margin:9px 2px 0;text-align:center;color:var(--green-800);font-size:13px}
    .hint{margin:8px 2px 0;color:var(--muted);font-size:11px;text-align:center}
    .credits{width:min(900px,100%);margin:0 auto 22px;padding:0 16px;text-align:center;color:#78867c;font-size:10px}
    .credits a{color:inherit}
    @media(min-width:760px){main{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.checkout{position:sticky;top:18px}.header-inner{padding-block:15px}.product{min-height:68px}}
    @media(max-width:430px){.header-inner{grid-template-columns:46px 1fr;padding:9px 12px;gap:9px}.crest img{width:38px;height:60px}.subtitle{font-size:12px}main{margin-top:12px;padding-inline:10px}.product{padding-left:11px}.product h2{font-size:14px}.price{font-size:12px;margin-left:3px}.controls{grid-template-columns:40px 38px 40px;gap:5px}.controls button,.qty{height:40px}.checkout{padding:13px 11px}.metric-value{font-size:19px}.payment-input{font-size:18px}}
    @media(max-width:350px){.header-inner{grid-template-columns:40px 1fr}.crest img{width:34px}.product{align-items:flex-start;flex-direction:column}.controls{align-self:flex-end}}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="crest" href="https://commons.wikimedia.org/wiki/File:Escudo_de_Valdorros.svg" target="_blank" rel="noreferrer" title="Escudo de Valdorros">
        <img src="/escudo-valdorros.png" alt="Escudo de Valdorros">
      </a>
      <div>
        <h1>Barra de Valdorros</h1>
        <p class="subtitle">Fiestas · Calculadora sin conexión</p>
      </div>
    </div>
  </header>

  <main>
    <section aria-label="Bebidas">
      <div class="category-bar"><strong>Bebidas</strong><span>14 productos</span></div>
      <div class="products" id="products"></div>
    </section>

    <aside class="checkout">
      <h2>Pedido actual</h2>
      <div class="checkout-grid">
        <div class="metric">
          <span class="metric-title">Total</span>
          <span class="metric-value" id="total">0,00 €</span>
        </div>
        <div class="metric">
          <label for="received">Pago</label>
          <input class="payment-input" id="received" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
        </div>
        <div class="metric">
          <span class="metric-title" id="changeLabel">Vueltas</span>
          <span class="metric-value change-value" id="change">—</span>
        </div>
      </div>
      <div class="quick" aria-label="Importes rápidos">
        <button data-pay="10">10 €</button>
        <button data-pay="20">20 €</button>
        <button data-pay="50">50 €</button>
      </div>
      <ul class="receipt" id="receipt" aria-label="Líneas del pedido"></ul>
      <button class="reset-button" id="reset">Nuevo pedido / borrar</button>
      <div class="message" id="message" role="status"></div>
      <p class="hint">Añádela a la pantalla de inicio para usarla sin Internet.</p>
    </aside>
  </main>

  <p class="credits">Escudo de Valdorros por <a href="https://commons.wikimedia.org/wiki/User:Asqueladd" target="_blank" rel="noreferrer">Asqueladd</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noreferrer">CC BY-SA 3.0</a>.</p>

  <script>
    const products=[
      {id:'agua',name:'Agua',priceCents:100},
      {id:'refresco',name:'Refresco',priceCents:200},
      {id:'cachi',name:'Cachi Kalimotxo / Cerveza',priceCents:500},
      {id:'cachi-cubata',name:'Cachi Cubata',priceCents:1100},
      {id:'pinta',name:'Pinta cerveza / Kali',priceCents:300},
      {id:'cubata',name:'Cubata',priceCents:600},
      {id:'cana',name:'Caña / botellín',priceCents:150},
      {id:'radler',name:'Radler / 0,0',priceCents:150},
      {id:'chupito',name:'Chupito',priceCents:150},
      {id:'jager',name:'Jäger',priceCents:200},
      {id:'vino',name:'Vino',priceCents:150},
      {id:'vermut',name:'Vermut',priceCents:200},
      {id:'mosto',name:'Mosto',priceCents:150},
      {id:'zumo',name:'Zumo / batido',priceCents:200}
    ];
    const $=id=>document.getElementById(id);
    const money=cents=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(cents/100);
    let quantities={};

    function received(){
      const raw=$('received').value.trim().replace(',','.');
      if(!/^\d+(\.\d{1,2})?$/.test(raw))return null;
      const [euros,cents='']=raw.split('.');
      const value=Number(euros)*100+Number(cents.padEnd(2,'0'));
      return Number.isSafeInteger(value)&&value<=1000000?value:null;
    }

    function total(){return products.reduce((sum,product)=>sum+product.priceCents*(quantities[product.id]||0),0);}

    function update(){
      const amount=total(),paid=received();
      $('total').textContent=money(amount);
      $('receipt').replaceChildren();

      for(const product of products){
        const quantity=quantities[product.id]||0;
        document.querySelector(`[data-quantity="${product.id}"]`).textContent=quantity;
        document.querySelector(`[data-minus="${product.id}"]`).disabled=quantity===0;
        document.querySelector(`[data-plus="${product.id}"]`).disabled=quantity>=100;
        if(quantity){
          const row=document.createElement('li');
          const name=document.createElement('span');
          const price=document.createElement('span');
          name.textContent=`${quantity} × ${product.name}`;
          price.textContent=money(quantity*product.priceCents);
          row.append(name,price);
          $('receipt').append(row);
        }
      }

      $('change').classList.remove('short');
      if(paid===null){
        $('changeLabel').textContent='Vueltas';
        $('change').textContent='—';
      }else if(paid<amount){
        $('changeLabel').textContent='Falta';
        $('change').textContent=money(amount-paid);
        $('change').classList.add('short');
      }else{
        $('changeLabel').textContent='Vueltas';
        $('change').textContent=money(paid-amount);
      }
    }

    function reset(){
      quantities={};
      $('received').value='';
      update();
    }

    $('received').addEventListener('input',()=>{$('message').textContent='';update();});
    document.querySelectorAll('[data-pay]').forEach(button=>button.onclick=()=>{$('received').value=button.dataset.pay;$('message').textContent='';update();});
    $('reset').onclick=()=>{if(total()&&!confirm('¿Vaciar este pedido?'))return;reset();$('message').textContent='Pedido vacío.';};

    for(const product of products){
      const card=document.createElement('article');
      card.className='product';
      const copy=document.createElement('div');
      copy.className='product-copy';
      const title=document.createElement('h2');
      title.textContent=product.name;
      const price=document.createElement('span');
      price.className='price';
      price.textContent=money(product.priceCents);
      copy.append(title,price);

      const controls=document.createElement('div');
      controls.className='controls';
      const minus=document.createElement('button');
      const quantity=document.createElement('span');
      const plus=document.createElement('button');
      minus.textContent='−';
      minus.dataset.minus=product.id;
      minus.setAttribute('aria-label',`Quitar ${product.name}`);
      quantity.className='qty';
      quantity.dataset.quantity=product.id;
      plus.textContent='+';
      plus.className='plus';
      plus.dataset.plus=product.id;
      plus.setAttribute('aria-label',`Añadir ${product.name}`);
      minus.onclick=()=>adjust(product.id,-1);
      plus.onclick=()=>adjust(product.id,1);
      controls.append(minus,quantity,plus);
      card.append(copy,controls);
      $('products').append(card);
    }

    function adjust(id,delta){
      quantities[id]=Math.max(0,Math.min(100,(quantities[id]||0)+delta));
      $('message').textContent='';
      update();
    }

    update();
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));}
  </script>
</body>
</html>
